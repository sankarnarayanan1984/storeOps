<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity · StoreOps</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/auth.js"></script>
</head>
<body>
<nav class="topnav"><div class="inner">
  <a class="brand" href="/">StoreOps</a>
  <a class="tab" href="/activities" aria-current="page">Activities</a>
  <a class="tab" href="/programmes">Programmes</a>
  <a class="tab" href="/staff">Staff</a>
</div></nav>
<main>
  <a class="crumb" href="/activities">← All activities</a>
  <header class="page">
    <h1 id="title">Loading…</h1>
    <span id="status"></span>
  </header>

  <div id="flash" class="notice success" hidden></div>
  <div id="error" class="notice error" hidden></div>

  <section class="card" id="card" hidden>
    <dl class="details" id="details"></dl>
  </section>

  <section id="manage" hidden>
    <h2 class="section-title">Update</h2>
    <div id="auth" class="auth-slot"></div>
    <form id="update" class="card inline-form" hidden>
      <div>
        <label for="newStatus">Status</label>
        <select id="newStatus" name="status"></select>
      </div>
      <div>
        <label for="newPriority">Priority</label>
        <select id="newPriority" name="priority">
          <option value="LOW">Low</option><option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option><option value="CRITICAL">Critical</option>
        </select>
      </div>
      <button class="btn" type="submit">Save</button>
      <button class="btn danger" type="button" id="delete">Delete</button>
    </form>
  </section>
</main>
<script>
  const STATUS_LABELS = { TODO: 'To do', IN_PROGRESS: 'In progress', BLOCKED: 'Blocked', DONE: 'Done' };
  // Mirrors ALLOWED_TRANSITIONS in activities.service.ts; the API is the source of truth.
  const NEXT = { TODO: ['IN_PROGRESS', 'BLOCKED', 'DONE'], IN_PROGRESS: ['BLOCKED', 'DONE'], BLOCKED: ['IN_PROGRESS', 'DONE'], DONE: [] };
  const auth = window.StoreOpsAuth;
  const id = decodeURIComponent(location.pathname.split('/').pop());
  const formatDate = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  const updateForm = document.getElementById('update');
  let item = null;

  function show(box, message) {
    const el = document.getElementById(box);
    el.textContent = message;
    el.hidden = !message;
  }

  function render(next) {
    item = next;
    document.title = `${item.title} · StoreOps`;
    document.getElementById('title').textContent = item.title;

    const badge = document.createElement('span');
    badge.className = `badge ${item.status}`;
    badge.textContent = STATUS_LABELS[item.status] ?? item.status;
    document.getElementById('status').replaceChildren(badge);

    const fields = [
      ['ID', item.id, true],
      ['Description', item.description],
      ['Category', item.category],
      ['Priority', item.priority],
      ['Programme', item.programmeId, true],
      ['Store', item.storeId, true],
      ['Region', item.regionId, true],
      ['Assignee', item.assigneeId, true],
      ['Created by', item.createdBy, true],
      ['Due', formatDate(item.dueAt)],
      ['Created', formatDate(item.createdAt)],
      ['Updated', formatDate(item.updatedAt)],
    ];
    const dl = document.getElementById('details');
    dl.replaceChildren();
    for (const [label, value, mono] of fields) {
      const dt = document.createElement('dt');
      dt.textContent = label;
      const dd = document.createElement('dd');
      dd.textContent = value ?? '—';
      if (mono && value) dd.className = 'mono';
      if (!value) dd.classList.add('muted');
      dl.append(dt, dd);
    }

    const status = updateForm.elements.status;
    status.replaceChildren(...[item.status, ...NEXT[item.status]].map((s) => {
      const o = document.createElement('option');
      o.value = s;
      o.textContent = s === item.status ? `${STATUS_LABELS[s]} (current)` : STATUS_LABELS[s];
      return o;
    }));
    updateForm.elements.priority.value = item.priority;
    document.getElementById('card').hidden = false;
    document.getElementById('manage').hidden = false;
  }

  async function send(method, body) {
    show('error', '');
    show('flash', '');
    const res = await auth.fetch(`/api/activities/${encodeURIComponent(id)}`, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 204) return null;
    const json = await res.json();
    if (!res.ok) throw new Error(json.error?.message ?? `Request failed (${res.status})`);
    return json;
  }

  updateForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const changes = {};
    if (updateForm.elements.status.value !== item.status) changes.status = updateForm.elements.status.value;
    if (updateForm.elements.priority.value !== item.priority) changes.priority = updateForm.elements.priority.value;
    if (!Object.keys(changes).length) return show('flash', 'Nothing to change.');
    try {
      render(await send('PATCH', changes));
      show('flash', 'Saved.');
    } catch (err) {
      show('error', err.message);
    }
  });

  document.getElementById('delete').addEventListener('click', async () => {
    if (!confirm(`Delete "${item.title}"? This cannot be undone.`)) return;
    try {
      await send('DELETE');
      try { sessionStorage.setItem('activityFlash', `Deleted "${item.title}".`); } catch { /* ignore */ }
      location.href = '/activities';
    } catch (err) {
      show('error', err.message);
    }
  });

  auth.mount(document.getElementById('auth'));
  auth.onChange((user) => { updateForm.hidden = !user; });

  (async () => {
    try {
      const res = await fetch(`/api/activities/${encodeURIComponent(id)}`);
      const body = await res.json();
      if (!res.ok) throw new Error(body.error?.message ?? `Request failed (${res.status})`);
      render(body);
    } catch (err) {
      document.getElementById('title').textContent = 'Activity not found';
      show('error', err.message);
    }
  })();
</script>
</body>
</html>
